name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Tests are hermetic: model/gateway/Qdrant are never called. Point them at
    # an unreachable address so a regression that adds a live call fails loudly
    # instead of silently depending on the home lab. tests/conftest.py pins the
    # same values from inside the repo; this block is the belt to its braces.
    env:
      SB_STORE: chroma
      OPENAI_API_KEY: test-key
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
      QDRANT_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run tests
        # No -q here: pyproject's addopts already supplies one, and a second
        # suppresses the count/duration summary entirely -- so the CI log ends
        # with a bare row of dots and nothing you can grep for a test count.
        run: uv run --frozen pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff
        # The rule selection lives in pyproject and is deliberately small: a
        # linter that fires a hundred times on working code gets switched off.
        run: uvx ruff check src tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        # The proxy holds the corpus gate and the owner-session check. Until it
        # has tests, a typecheck is the only automated statement about it at all.
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit
        # Advisory: a new advisory against a transitive dependency should not
        # block a merge at 3am, but it should be visible in the log.
        run: npm audit --audit-level=high || true
