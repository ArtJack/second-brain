[project]
name = "second-brain"
version = "0.1.0"
description = "A personal RAG assistant — ask your own notes/docs/code and get cited answers. Runs on the home lab."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "chromadb>=0.5",
    "langgraph>=1.2.2",
    "pypdf>=4.2",
    "python-dotenv>=1.0",
    "qdrant-client>=1.18.0",
    "typer>=0.12",
    "rich>=13.7",
    "mcp[cli]>=1.27.2",
    "uvicorn>=0.48.0",
    "playwright>=1.57",
    "fastapi>=0.136.3",
]

[project.scripts]
sb = "secondbrain.cli:app"
artjeck = "secondbrain.cli:artjeck_main"
sb-mcp = "secondbrain.mcp_server:main"
sb-web-api = "secondbrain.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secondbrain"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Chosen to catch real defects and keep imports honest, not to impose a style.
# A linter that fires 99 times on a working codebase gets switched off, so the
# selection is small enough that zero is the normal state and a new finding means
# something.
select = ["E", "F", "I", "UP", "B", "PIE", "PLR0402", "RUF", "FLY", "SIM117"]
ignore = [
    # typer's whole API is `x: T = typer.Option(...)` in the signature. This rule
    # is right in general and wrong for every CLI command in this project.
    "B008",
    # Long lines are usually a comment explaining why, and wrapping those hurts.
    "E501",
    # Both remaining hits are deliberate. `›` is a separator glyph in CLI output,
    # and the Cyrillic `а` sits inside a character class that exists precisely to
    # match Russian text — the rule is right in general and wrong on both.
    "RUF001",
    # `class Corpus(str, Enum)` is what FastAPI and pydantic serialise today.
    # StrEnum is equivalent on 3.11+, but this enum is the public web API's
    # corpus contract and is not worth re-testing for a style point.
    "UP042",
    # The one hit is a list of help lines joined for display; an f-string there
    # would be longer and harder to edit.
    "FLY002",
]

[tool.ruff.lint.per-file-ignores]
# Tests name their fixtures and fakes for the reader, not the import sorter.
"tests/*" = ["E402"]
